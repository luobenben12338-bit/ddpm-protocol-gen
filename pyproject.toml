[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-replay-lab"
version = "0.1.0"
description = "Refactored Modbus/S7 DDPM replay lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "dpkt>=1.9.8",
  "torch>=2.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "Pillow>=10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
